name: Release

# Every change to the app that lands on main is built, tested and published as a GitHub release whose
# asset is the prebuilt package, kipdeck.tgz (deploy/release/pack.mjs). GitHub sends
# https://github.com/zbagdzevicius/kipdeck/releases/latest/download/kipdeck.tgz to the newest one, and
# that address is what the README's first command (npx), install.sh and install.ps1 install: nothing
# is built on the user's machine. The version is package.json's major.minor plus the number of commits
# on main (v0.1.68, v0.1.69, ...); bump package.json for a new minor.
#
# Pull requests get the same build, tests and a real install of the packed release on Linux, macOS
# and Windows, but publish nothing.
#
# The jobs:
# - test: typecheck and every test but the landing page's, the gate for publishing;
# - landing: the landing page's tests (tests/landing*.test.ts). The page is not in the package and
#   ships to Vercel on its own, so its browser timing budgets fail this workflow without holding
#   back the app's release;
# - pack: builds and packs kipdeck.tgz once;
# - smoke: on Linux and macOS, runs that tarball the way the README's npx command does, installs it
#   with install.sh, starts it and checks it answers;
# - smoke-windows: the same with install.ps1, reported but not a publish gate (docs/demo.md still
#   sends Windows users to WSL);
# - publish: on main, once test and smoke pass, releases it and checks the README's address serves it.
#
# The paths below are everything `npm run build` (and so `prepare`), the replay demo's build and the
# packed release read; tests/release-paths.test.ts keeps them that way.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vite.*.config.ts'
      - 'deploy/replay/**'
      - 'deploy/release/**'
      - 'skills/**'
      - 'NOTICE'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vite.*.config.ts'
      - 'deploy/replay/**'
      - 'deploy/release/**'
      - 'skills/**'
      - 'NOTICE'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # some tests read the history (the launch's what's-new)

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      # tests/pseudonym.test.ts checks the office's pseudonyms against the onchain package's own (viem).
      - name: Install the onchain package the tests cross-check
        working-directory: onchain/attest
        run: npm ci --ignore-scripts

      - run: npm run typecheck

      # The replay demo (docs/demo.md#the-replay-demo) isn't part of `build`, so installs never build
      # it; it's built here so tests/replay-e2e.test.ts checks it on every pull request.
      - name: Build the replay demo
        run: npm run build:replay

      - name: Test, all but the landing page
        run: node --import tsx --import=#tests/css --test $(ls tests/*.test.ts | grep -v '^tests/landing')

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test the landing page
        run: node --import tsx --import=#tests/css --test tests/landing*.test.ts

  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits on main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci

      - name: Pack the release
        id: pack
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$(git rev-list --count HEAD)"
          node deploy/release/pack.mjs --version "$version" --out "$RUNNER_TEMP/release"
          tar -tzf "$RUNNER_TEMP/release/kipdeck.tgz" | grep -qx 'package/npm-shrinkwrap.json'
          tar -xzOf "$RUNNER_TEMP/release/kipdeck.tgz" package/package.json | node -e '
            const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (p.version !== process.argv[1]) throw new Error(`packed ${p.version}, not ${process.argv[1]}`);
            if (p.scripts?.prepare) throw new Error("the release would build on install");
          ' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: kipdeck-release
          path: ${{ runner.temp }}/release/kipdeck.tgz
          if-no-files-found: error

  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: kipdeck-release
          path: ${{ runner.temp }}/release

      - name: Run it the way the README's npx command does
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          # A bare path would run as a command, so the local tarball goes by --package; the README's
          # address is the same package fetched over https.
          npx --yes --package=./release/kipdeck.tgz kipdeck --help > help.txt
          grep -q 'releases/latest/download/kipdeck.tgz' help.txt

      - name: Install it with install.sh and start it
        env:
          KIPDECK_TARBALL: ${{ runner.temp }}/release/kipdeck.tgz
          KIPDECK_PREFIX: ${{ runner.temp }}/install
          KIPDECK_BIN_DIR: ${{ runner.temp }}/bin
          KIPDECK_INSTALL_ONLY: '1'
          AGENT_OFFICE_HOME: ${{ runner.temp }}/office
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          bash install.sh
          installed="$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/install/lib/node_modules/kipdeck/package.json")"
          [ "$installed" = "$VERSION" ] || { echo "installed $installed, not $VERSION"; exit 1; }
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bin/kipdeck" --host 127.0.0.1 --port 5480 --password ci --no-open > office.log 2>&1 &
          office=$!
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5480/login.html || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat office.log
          [ "$code" = 200 ] || { echo "the installed office didn't answer (last status: $code)"; exit 1; }
          kill -INT "$office"

  smoke-windows:
    needs: pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: kipdeck-release
          path: ${{ runner.temp }}/release

      - name: Run it the way the README's npx command does
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          # A bare path would run as a command, so the local tarball goes by --package; the README's
          # address is the same package fetched over https.
          npx --yes --package=./release/kipdeck.tgz kipdeck --help > help.txt
          grep -q 'releases/latest/download/kipdeck.tgz' help.txt

      - name: Install it with install.ps1 and start it
        shell: pwsh
        env:
          KIPDECK_TARBALL: ${{ runner.temp }}\release\kipdeck.tgz
          KIPDECK_INSTALL_ONLY: '1'
          AGENT_OFFICE_HOME: ${{ runner.temp }}\office
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installed = (npm ls --global kipdeck --json | ConvertFrom-Json).dependencies.kipdeck.version
          if ($installed -ne $env:VERSION) { Write-Host "installed $installed, not $($env:VERSION)"; exit 1 }
          Set-Location $env:RUNNER_TEMP
          $kipdeck = (Get-Command kipdeck.cmd).Source
          $office = Start-Process -FilePath $kipdeck -ArgumentList '--host', '127.0.0.1', '--port', '5480', '--password', 'ci', '--no-open' -PassThru -NoNewWindow -RedirectStandardOutput office.log -RedirectStandardError office.err
          $code = 0
          foreach ($i in 1..60) {
            try { $code = (Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:5480/login.html).StatusCode } catch { $code = 0 }
            if ($code -eq 200) { break }
            Start-Sleep -Seconds 1
          }
          Get-Content office.log, office.err
          if ($code -ne 200) { Write-Host "the installed office didn't answer (last status: $code)"; exit 1 }
          Stop-Process -Id $office.Id -Force

  publish:
    needs: [test, pack, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kipdeck-release
          path: release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.pack.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          # Only a newer version becomes the latest: a re-run of an older commit's workflow would
          # otherwise move releases/latest/download (the README's address) back to an older package.
          newest="$(gh release view --json tagName --jq .tagName 2> /dev/null || true)"
          latest=true
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "$newest is newer than $TAG, so $TAG is released without becoming the latest"
            latest=false
          fi
          gh release create "$TAG" release/kipdeck.tgz --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest="$latest"

      - name: The README's address serves it
        run: |
          for _ in $(seq 10); do
            code=$(curl -s -L -o /dev/null -w '%{http_code}' "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/kipdeck.tgz" || true)
            [ "$code" = 200 ] && exit 0
            sleep 3
          done
          echo "releases/latest/download/kipdeck.tgz answered $code"
          exit 1
