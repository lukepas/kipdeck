name: Proof of Merge showcase

# The public showcase as static files on GitHub Pages, so its link keeps working when the office is
# off. onchain/indexer rebuilds the board from public testnet data alone (Base Sepolia and Solana
# devnet, through their public RPCs), and scripts/showcase.ts exports it with the page's bundle.
# No secrets: it reads public chain data and GitHub's public API, and holds no keys.
#
# Off until someone runs it by hand (Actions > Proof of Merge showcase) or turns the schedule on, and
# needs Settings > Pages > Source set to GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      public:
        description: 'owner/name repositories to show in full (comma separated); others are checked against GitHub, else redacted'
        required: false
        default: ''

# Nothing by default: each job gets what it needs. The build runs third-party install code, so it
# only reads the repository; only the deploy job, which runs no npm code, can publish the site.
permissions: {}

concurrency:
  group: showcase-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the showcase bundle
        run: |
          npm ci --ignore-scripts
          npx vite build -c vite.showcase.config.ts
      - name: Install the onchain packages the indexer reads through
        run: |
          for p in attest reputation indexer; do (cd onchain/$p && npm ci --ignore-scripts); done
      - name: Rebuild the board from the chain (testnets only)
        working-directory: onchain/indexer
        # publicnode takes 1,000 blocks per eth_getLogs; sepolia.base.org now takes 200, which is
        # five times the calls and did not finish in 10 minutes on 2026-10-10.
        run: npm run index -- --network base-sepolia --rpc https://base-sepolia-rpc.publicnode.com --out out/
      - name: Export the site
        working-directory: onchain/indexer
        env:
          PUBLIC_REPOS: ${{ inputs.public }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run showcase -- --dataset out/dataset.json --out ../../site --site-url "$SITE_URL" --check-github ${PUBLIC_REPOS:+--public "$PUBLIC_REPOS"}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
