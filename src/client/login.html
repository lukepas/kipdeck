<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d131a" />
    <title>UGC Army - Sign in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-label="UGC Army">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 11 3l1 1 1-1 7 7v4l-8-8-8 8Z" fill="currentColor" /><path d="m4 17 8-8 8 8M4 22l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" /></svg>
        <span class="wordmark" aria-hidden="true">UGC <span>ARMY</span></span>
      </div>
      <h1>Sign in</h1>
      <p class="sub" id="sub">The inbox for your AI coding agents.</p>
      <form id="form">
        <label id="name-row" hidden>Name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" autofocus required /></label>
        <p id="name-note" class="note" hidden>Came in with the shared password? Leave your name blank.</p>
        <button type="submit" id="submit">Sign in</button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
