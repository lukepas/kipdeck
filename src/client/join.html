<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d131a" />
    <title>Kipdeck - Join</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-label="Kipdeck">
        <svg class="brand-mark" data-logo="mark" width="32" height="32" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4.7 21.6A11.3 9.4 0 1 1 27.3 21.6A11.3 9.4 0 1 1 4.7 21.6ZM10.5 16.9C5.3 12.3 3.4 5.4 4.7 1C8.5 3.6 11.5 10.1 10.5 16.9ZM21.5 16.9C20.5 10.1 23.5 3.6 27.3 1C28.6 5.4 26.7 12.3 21.5 16.9ZM8.4 21.1A3 3 0 1 0 14.4 21.1A3 3 0 1 0 8.4 21.1ZM11.5 20.1A0.8 0.8 0 1 1 13.1 20.1A0.8 0.8 0 1 1 11.5 20.1ZM17.6 21.1A3 3 0 1 0 23.6 21.1A3 3 0 1 0 17.6 21.1ZM20.7 20.1A0.8 0.8 0 1 1 22.3 20.1A0.8 0.8 0 1 1 20.7 20.1ZM15.4 14.1C13.8 11.5 14.8 8.1 16.9 6.6A0.5 0.5 0 0 1 17.5 7.4C15.5 9 15 10.8 16.6 13.4Z"/><path class="signal" d="M15.6 6A2.1 2.1 0 1 1 19.8 6A2.1 2.1 0 1 1 15.6 6Z"/></svg>
        <span class="wordmark" aria-hidden="true">KIP<span>DECK</span></span>
      </div>
      <h1 id="title">You're invited</h1>
      <p class="sub" id="sub">Checking your invite...</p>
      <form id="form" hidden>
        <label>Operator name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required /></label>
        <label>Pick a password<input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>Once more<input id="again" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p class="note">At least 8 characters. It's yours alone: nobody else on the deck ever sees it.</p>
        <button type="submit" id="submit">Make my account</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>Go to sign in</a>
    </main>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
