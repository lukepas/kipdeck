<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d131a" />
    <title>Kipdeck - Join</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-label="Kipdeck">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 11 3l1 1 1-1 7 7v4l-8-8-8 8Z" fill="currentColor" /><path d="m4 17 8-8 8 8M4 22l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" /></svg>
        <span class="wordmark" aria-hidden="true">MERGE<span>LINE</span></span>
      </div>
      <h1 id="title">You're invited</h1>
      <p class="sub" id="sub">Checking your invite...</p>
      <form id="form" hidden>
        <label>Operator name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required /></label>
        <label>Pick a password<input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>Once more<input id="again" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p class="note">At least 8 characters. It's yours alone: nobody else on the deck ever sees it.</p>
        <button type="submit" id="submit">Make my account</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>Go to sign in</a>
    </main>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
