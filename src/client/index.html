<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Kipdeck</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./lite.css" />
  </head>
  <body class="lite">
    <!-- The home page (lite.ts, home/): the inbox for your AI coding agents. The 3D Deck is /deck (Enter the Deck, top right). -->
    <header class="hb">
      <a class="hb-brand" href="/" aria-label="Kipdeck, the inbox for your AI coding agents">
        <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 11 3l1 1 1-1 7 7v4l-8-8-8 8Z" fill="currentColor" /><path d="m4 17 8-8 8 8M4 22l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" /></svg>
        <span class="hb-name">Kipdeck</span>
      </a>
      <div id="demo" class="hb-demo hidden" role="note"></div>
      <select id="project" class="hb-project hidden" aria-label="Project"></select>
      <div id="owner" class="hb-owner hidden" role="group" aria-label="Whose agents"></div>
      <label class="hb-search">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" /><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" /></svg>
        <input id="search" type="search" placeholder="Search" aria-label="Search agents" autocomplete="off" spellcheck="false" />
        <kbd class="hb-kbd" title="Commands: Ctrl+K">Ctrl K</kbd>
      </label>
      <div id="pulse" class="hb-pulse hidden" aria-label="Today"></div>
      <span class="hb-grow"></span>
      <a id="to-deck" class="deck-cta" href="/deck" title="Enter the Deck: the same agents at their stations, in 3D, and a wall display for a team room (D)">
        <span class="deck-cta-ico" aria-hidden="true"></span>
        <span class="deck-cta-label">Enter the Deck</span>
        <span class="deck-cta-live hidden" aria-hidden="true"><i class="deck-cta-dot"></i><b class="deck-cta-n"></b><span class="deck-cta-words"></span></span>
        <span class="deck-cta-go" aria-hidden="true"></span>
      </a>
      <button id="btn-deploy" class="btn primary hb-deploy" type="button" title="Deploy an agent (N)">Deploy agent</button>
      <button id="btn-avatar" class="hb-avatar" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Menu">?</button>
    </header>
    <main class="home-main">
      <section class="inbox-col" aria-label="Inbox">
        <div id="pulse-list" class="list-pulse hidden" aria-label="Today"></div>
        <a id="to-deck-row" class="deck-cta deck-cta-row" href="/deck" title="Enter the Deck: the same agents at their stations, in 3D">
          <span class="deck-cta-ico" aria-hidden="true"></span>
          <span class="deck-cta-label">Enter the Deck</span>
          <span class="deck-cta-live hidden" aria-hidden="true"><i class="deck-cta-dot"></i><b class="deck-cta-n"></b><span class="deck-cta-words"></span></span>
          <span class="deck-cta-go" aria-hidden="true"></span>
        </a>
        <div id="digest"></div>
        <div id="inbox" class="inbox"></div>
        <div id="checklist" class="checklist hidden"></div>
        <section id="shipped" class="shipped" aria-label="Shipped today"></section>
      </section>
      <section id="pane" class="pane" aria-label="Selected agent"></section>
    </main>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconnecting...</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
  </body>
</html>
