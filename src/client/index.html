<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d131a" />
    <title>UGC Army</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./lite.css" />
  </head>
  <body class="lite">
    <!-- The home page (lite.ts): every agent ranked by what needs you, no 3D. The 3D bridge is /bridge (Labs). -->
    <header class="lite-bar">
      <span class="brand" aria-label="UGC Army">
        <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10 11 3l1 1 1-1 7 7v4l-8-8-8 8Z" fill="currentColor" /><path d="m4 17 8-8 8 8M4 22l8-8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" /></svg>
        <span class="brand-word" aria-hidden="true"><b>UGC</b> <span>ARMY</span></span>
      </span>
      <label class="lite-floor" title="The project you're looking at: pick another to see its agents">
        <span class="lite-floor-label">Project</span>
        <select id="floor" aria-label="Project"></select>
      </label>
      <button id="btn-mission" class="btn" type="button" title="Mission control: what needs someone, in every project">Mission <span class="n"></span></button>
      <a id="to-bridge" class="btn hidden" href="/bridge" title="The 3D bridge: the same agents as a room to walk around, or a wall display for a team (Labs)">Bridge view</a>
      <button id="btn-print" class="btn lite-icon" type="button" aria-pressed="false" title="Light or dark" aria-label="Light colors"></button>
      <button id="btn-labs" class="btn lite-icon" type="button" title="Labs: the parts beyond the inbox, off until switched on" aria-label="Labs"></button>
    </header>
    <main class="lite-main">
      <section class="lite-plot-panel" aria-labelledby="plot-h">
        <h2 id="plot-h" class="lite-h">Deck plan <span class="lite-legend" id="legend"></span></h2>
        <div id="plot" class="lite-plot"></div>
      </section>
      <div class="lite-list">
      <p id="floor-meta" class="lite-meta"></p>
      <div id="mission-strip" class="lite-mission"></div>
      <div id="elsewhere" class="lite-elsewhere hidden"></div>
      <h2 class="lite-h">Agents <span id="waiting-now" class="lite-waiting"></span><button id="btn-digest" class="btn lite-all" type="button" title="While you were away: what happened since you were last here">Catch up</button><button id="all-floors" class="btn lite-all" type="button" aria-pressed="false" title="Show the agents in every project, not just this one">All projects</button></h2>
      <ol id="workers" class="lite-workers" aria-label="Agents, most in need of you first"></ol>
      </div>
    </main>
    <nav class="lite-nav" aria-label="Deck">
      <button id="btn-issues" class="btn" type="button" data-icon="issue">Issues <span class="n"></span></button>
      <button id="btn-pulls" class="btn" type="button" data-icon="pull">PRs <span class="n"></span></button>
      <button id="btn-queue" class="btn" type="button" data-icon="queue">Queue <span class="n"></span></button>
      <button id="btn-new" class="btn primary" type="button" data-icon="plus">New task</button>
    </nav>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconnecting...</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
  </body>
</html>
