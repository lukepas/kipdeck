[package]
name = "bounty-escrow"
description = "Native Solana program: USDC bounties for GitHub issues, released only when an attester and an approver both sign for a pull request a person merged."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Leaves the entrypoint out, for a program that links this one as a library.
no-entrypoint = []
# Also allow the test mint that stands in for USDC on devnet and in local tests.
test-mint = ["bounty-escrow-core/test-mint"]

[dependencies]
bounty-escrow-core = { path = "../bounty-escrow-core" }
solana-program = "2"

[dev-dependencies]
bounty-escrow-core = { path = "../bounty-escrow-core", features = ["test-mint"] }
serde_json = "1"

[lints.rust]
# solana-program's entrypoint! macro checks cfgs the Solana toolchain sets (target_os = "solana").
unexpected_cfgs = { level = "allow" }
